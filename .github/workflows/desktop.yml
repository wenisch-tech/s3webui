name: Desktop packages

# Builds the jpackage installers (deb, rpm, Arch, msi, dmg x2) with a bundled JRE.
# jpackage cannot cross-build, so every OS runs on its own runner.
on:
  workflow_dispatch:
  push:
    branches:
      - 'experimental/**'
    paths:
      - 'pom.xml'
      - 'src/**'
      - 'packaging/**'
      - '.github/workflows/desktop.yml'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tag:
        description: Release tag to attach the packages to
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  # jpackage needs numeric X.Y.Z; strip any -pr/-SNAPSHOT suffix
  RAW_VERSION: ${{ inputs.version }}

jobs:
  linux:
    name: Linux (app-image, deb, rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install rpm tooling
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot

      - name: Resolve version
        run: |
          v="${RAW_VERSION:-$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)}"
          echo "APP_VERSION=${v%%-*}" >> "$GITHUB_ENV"

      - name: Build packages
        run: >
          mvn -B -Pdesktop,desktop-package,desktop-linux-image,desktop-linux-packages
          -DskipTests -Djacoco.skip=true -Ddesktop.app.version="$APP_VERSION"
          pre-integration-test

      - name: Keep app-image for the Arch job
        run: tar -C target/dist -cf s3webui-appimage.tar S3WEBUI

      - uses: actions/upload-artifact@v7
        with:
          name: s3webui-appimage
          path: s3webui-appimage.tar

      - uses: actions/upload-artifact@v7
        with:
          name: s3webui-linux
          path: |
            target/dist/*.deb
            target/dist/*.rpm

  arch:
    name: Arch (pacman)
    needs: linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: s3webui-appimage

      - name: Build pacman package
        run: |
          pacman -Syu --noconfirm base-devel git
          mkdir -p target/dist && tar -C target/dist -xf s3webui-appimage.tar
          useradd -m builder
          chown -R builder .
          v="${RAW_VERSION:-1.0.0}"
          su builder -c "cd packaging/arch && S3WEBUI_VERSION='${v%%-*}' makepkg -f --nodeps"
          mkdir -p out && mv packaging/arch/*.pkg.tar.zst out/

      - uses: actions/upload-artifact@v7
        with:
          name: s3webui-arch
          path: out/*.pkg.tar.zst

  windows:
    name: Windows (msi)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve version
        run: |
          v="${RAW_VERSION:-$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)}"
          echo "APP_VERSION=${v%%-*}" >> "$GITHUB_ENV"

      - name: Build msi
        run: >
          mvn -B -Pdesktop,desktop-package,desktop-windows
          -DskipTests -Djacoco.skip=true -Ddesktop.app.version="$APP_VERSION"
          pre-integration-test

      - uses: actions/upload-artifact@v7
        with:
          name: s3webui-windows
          path: target/dist/*.msi

  macos:
    name: macOS ${{ matrix.arch }} (dmg)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest   # Apple Silicon
            arch: arm64
          - runner: macos-15-intel # Intel
            arch: x64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Resolve version
        run: |
          v="${RAW_VERSION:-$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)}"
          echo "APP_VERSION=${v%%-*}" >> "$GITHUB_ENV"

      - name: Build dmg
        run: >
          mvn -B -Pdesktop,desktop-package,desktop-mac
          -DskipTests -Djacoco.skip=true -Ddesktop.app.version="$APP_VERSION"
          pre-integration-test

      - name: Add architecture to file name
        run: |
          for f in target/dist/*.dmg; do mv "$f" "${f%.dmg}-${{ matrix.arch }}.dmg"; done

      - uses: actions/upload-artifact@v7
        with:
          name: s3webui-macos-${{ matrix.arch }}
          path: target/dist/*.dmg

  release:
    name: Attach to release
    if: inputs.tag != ''
    needs: [linux, arch, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: s3webui-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          rm -f s3webui-appimage.tar
          sha256sum * > SHA256SUMS

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          files: dist/*
