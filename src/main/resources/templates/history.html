<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:replace="~{fragments/shell :: head('History')}"></head><body><nav th:replace="~{fragments/shell :: topbar('history')}"></nav><main class="page"><header class="page-header"><div><p class="eyebrow">Audit</p><h1 class="page-title">History</h1><p class="page-copy">Newest actions are listed first.</p></div></header><section class="panel mb-4"><div class="panel-body"><div class="grid gap-3 md:grid-cols-3"><label><span class="field-label">Filter by user</span><select id="filterUser" class="input"><option value="">All users</option></select></label><label><span class="field-label">Filter by action</span><select id="filterAction" class="input"><option value="">All actions</option></select></label><div class="flex items-end"><button class="btn-secondary w-full" type="button" onclick="resetFilters()"><i data-lucide="x"></i>Reset filters</button></div></div></div></section><section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Type</th><th>Bucket</th><th>Object / Details</th></tr></thead><tbody id="historyTableBody"><tr><td colspan="6" class="py-8 text-center text-slate-500">Loading history...</td></tr></tbody></table></div></section></main><div th:replace="~{fragments/shell :: footer}"></div><div th:replace="~{fragments/shell :: s3ConfigDialog}"></div><div th:replace="~{fragments/shell :: scripts}"></div><script>
document.addEventListener('DOMContentLoaded',()=>ensureS3ConfigDialog());let allHistory=[];const actionBadgeClass={CREATE:'badge-good',DELETE:'badge-bad',EDIT:'badge-warn'};const escapeHtml=v=>String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function renderTable(){const b=document.getElementById('historyTableBody'),u=filterUser.value,a=filterAction.value,rows=allHistory.filter(e=>(!u||e.user===u)&&(!a||e.action===a));if(!rows.length){b.innerHTML='<tr><td colspan="6" class="py-8 text-center text-slate-500">No history entries found for the selected filters.</td></tr>';return}b.innerHTML=rows.map(e=>{const failed=String(e.details||'').toLowerCase().startsWith('failed:'),label=failed?'FAILED':e.action||'-';return `<tr><td class="text-xs text-slate-500">${escapeHtml(e.timestamp?new Date(e.timestamp).toLocaleString():'-')}</td><td>${escapeHtml(e.user||'anonymous')}</td><td><span class="${failed?'badge-bad':actionBadgeClass[e.action]||'badge'}">${escapeHtml(label)}</span></td><td>${escapeHtml(e.resourceType||'-')}</td><td>${escapeHtml(e.bucket||'-')}</td><td>${escapeHtml(e.details||'-')}${e.key?`<span class="mt-1 block text-xs text-slate-500">${escapeHtml(e.key)}</span>`:''}</td></tr>`}).join('')}function resetFilters(){filterUser.value='';filterAction.value='';renderTable()}async function loadHistory(){try{const r=await fetch('/api/history');if(!r.ok)throw Error('Failed to load history');allHistory=(await r.json()).sort((a,b)=>new Date(b.timestamp)-new Date(a.timestamp));['filterUser','filterAction'].forEach(id=>{const values=[...new Set(allHistory.map(e=>e[id==='filterUser'?'user':'action']).filter(Boolean))].sort(),s=document.getElementById(id);values.forEach(v=>s.add(new Option(v,v)));s.onchange=renderTable});renderTable()}catch(e){historyTableBody.innerHTML='<tr><td colspan="6" class="py-8 text-center text-bad-500">Could not load history.</td></tr>';showToast(e.message,'danger')}}loadHistory();
</script></body></html>
