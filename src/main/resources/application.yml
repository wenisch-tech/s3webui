spring:
  application:
    name: s3webui
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB
      file-size-threshold: 10MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:${app.data-dir}/s3webui}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080
  # Honor X-Forwarded-* headers from a TLS-terminating reverse proxy or ingress, so redirect URIs
  # built for the OIDC flow (and any other absolute link) use the public https:// origin rather than
  # the plain-http one the proxy actually connects to this pod with. A no-op when there is no proxy.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  data-dir: ${APP_DATA_DIR:./data}
  encryption-key: ${APP_ENCRYPTION_KEY:}
  admin:
    email: ${ADMIN_EMAIL:admin@s3webui.local}
    password: ${ADMIN_PASSWORD:admin}

s3:
  access-key: ${S3_ACCESS_KEY:}
  secret-key: ${S3_SECRET_KEY:}
  endpoint-url: ${S3_ENDPOINT_URL:}
  region: ${S3_REGION:}
  insecure-skip-tls-verify: ${S3_INSECURE_SKIP_TLS_VERIFY:false}

iam:
  enabled: ${IAM_ENABLED:true}

oidc:
  enabled: ${OIDC_ENABLED:false}
  provider-name: ${OIDC_PROVIDER_NAME:Single Sign-On}
  client-id: ${OIDC_CLIENT_ID:}
  client-secret: ${OIDC_CLIENT_SECRET:}
  issuer-uri: ${OIDC_ISSUER_URI:}
  required-role: ${OIDC_REQUIRED_ROLE:}
  create-users: ${OIDC_CREATEUSERS:true}
  insecure-skip-tls-verify: ${OIDC_INSECURE_SKIP_TLS_VERIFY:false}
